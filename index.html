<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Velocity Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f12;--surface:#141619;--surface2:#1c1f23;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#e8eaed;--muted:#6b7280;--accent:#6ee7b7;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;font-size:14px}

/* Password */
#pw-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:2rem}
#pw-screen .logo{font-family:var(--mono);font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.pw-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px}
.pw-box input{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;font-size:14px;color:var(--text);font-family:var(--mono);outline:none;width:100%}
.pw-box button{background:var(--accent);color:#0d0f12;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:500;cursor:pointer}
.pw-error{font-size:12px;color:#f87171;display:none}

/* Topbar */
.topbar{position:sticky;top:0;z-index:100;background:rgba(13,15,18,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-title{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.topbar-file{font-size:12px;color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:8px}
.year-tab{padding:5px 12px;border-radius:6px;font-size:12px;font-family:var(--mono);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.year-tab.active{background:var(--accent);color:#0d0f12;border-color:var(--accent);font-weight:500}
.year-tab:hover:not(.active){border-color:var(--border2);color:var(--text)}
.reload-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-family:var(--mono);border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer}
.reload-btn:hover{border-color:var(--border2);color:var(--text)}

/* Layout */
.main{padding:24px;max-width:1400px;margin:0 auto}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-family:var(--mono)}

/* Summary */
.summary-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.summary-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.summary-value{font-size:22px;font-weight:500;font-family:var(--mono)}
.summary-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* Person grid */
.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:28px}
.person-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .15s;cursor:pointer}
.person-card:hover{border-color:var(--border2)}
.pc-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pc-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;font-family:var(--mono);flex-shrink:0}
.pc-name{font-size:14px;font-weight:500}
.pc-sprints{font-size:11px;color:var(--muted);margin-top:1px}
.pc-badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;font-family:var(--mono);font-weight:500}
.pc-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pc-year{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:32px}
.pc-bar-bg{flex:1;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden}
.pc-bar-fill{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:5px;font-size:9px;font-family:var(--mono);color:rgba(0,0,0,.7);font-weight:500}
.pc-bar-label{font-family:var(--mono);font-size:10px;color:var(--muted);min-width:42px;text-align:right}
.pc-divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.pc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pc-stat-label{font-size:10px;color:var(--muted);margin-bottom:2px}
.pc-stat-value{font-size:15px;font-weight:500;font-family:var(--mono)}
.pc-stat-sub{font-size:10px;color:var(--muted)}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px}
.chart-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono);margin-bottom:16px}

/* Sprint table */
.trend-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:28px;overflow-x:auto}
.trend-table{width:100%;border-collapse:collapse;font-size:12px}
.trend-table th{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.trend-table td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.trend-table tr:last-child td{border-bottom:none}
.trend-table tr:hover td{background:var(--surface2)}
.cell-pill{display:inline-block;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* Metric cards */
.metric2{background:var(--surface2);border-radius:8px;padding:8px 10px}
.metric-label2{font-size:11px;color:var(--muted);margin-bottom:2px}
.metric-value2{font-size:16px;font-weight:500}
</style>
</head>
<body>

<!-- Password -->
<div id="pw-screen">
  <div class="logo">Sprint Velocity Dashboard</div>
  <div class="pw-box">
    <div style="font-size:15px;font-weight:500">Erişim şifresi</div>
    <input type="password" id="pw-input" placeholder="Şifre" autofocus onkeydown="if(event.key==='Enter')checkPw()">
    <div class="pw-error" id="pw-error">Şifre hatalı.</div>
    <button onclick="checkPw()">Giriş</button>
  </div>
</div>

<!-- Main App -->
<div id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-title">Velocity</span>
      <span class="topbar-file">IT_Rapor.xlsx</span>
    </div>
    <div class="topbar-right">
      <div id="year-tabs"></div>
      <div style="display:flex;gap:4px;margin-left:8px">
        <button class="year-tab active" id="tab-yazilim" onclick="switchTab('yazilim')">Yazılım</button>
        <button class="year-tab" id="tab-test" onclick="switchTab('test')">Test</button>
        <button class="year-tab" id="tab-analiz" onclick="switchTab('analiz')">Analiz</button>
      </div>
    </div>
  </div>

  <!-- Yazılım -->
  <div id="page-yazilim" class="main"></div>

  <!-- Test -->
  <div id="page-test" style="display:none">
    <div class="topbar">
      <div class="topbar-left">
        <button onclick="switchTab('yazilim')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px;padding:0">&#8592; Yazılım</button>
        <span class="topbar-title" style="margin-left:8px">Test</span>
      </div>
    </div>
    <div class="main" id="test-content"></div>
  </div>

  <!-- Analiz -->
  <div id="page-analiz" style="display:none">
    <div class="topbar">
      <div class="topbar-left">
        <button onclick="switchTab('yazilim')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px;padding:0">&#8592; Yazılım</button>
        <span class="topbar-title" style="margin-left:8px">Analiz</span>
      </div>
    </div>
    <div class="main" id="analiz-content"></div>
  </div>

  <!-- Kişi detay -->
  <div id="page-person" style="display:none">
    <div class="topbar">
      <div class="topbar-left">
        <button onclick="closePerson()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-family:var(--mono);font-size:12px;padding:0">&#8592; Geri</button>
        <span class="topbar-title" id="person-name" style="margin-left:8px"></span>
      </div>
      <div class="topbar-right">
        <div id="person-year-tabs"></div>
      </div>
    </div>
    <div class="main" id="person-content"></div>
  </div>
</div>

// ── Auth ──
function checkPw() {
  const v = document.getElementById('pw-input').value;
  if (v === CORRECT_PASSWORD) {
    document.getElementById('pw-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
  }
}
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') checkPw(); });

// ── Init ──
function init() {
  const years = Object.keys(EMBEDDED_DATA).sort();
  activeYear = years[years.length - 1];
  const tabs = document.getElementById('year-tabs');
  tabs.innerHTML = '';
  years.forEach(y => {
    const btn = document.createElement('button');
    btn.className = 'year-tab' + (y === activeYear ? ' active' : '');
    btn.textContent = y;
    btn.onclick = () => {
      activeYear = y;
      tabs.querySelectorAll('.year-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDashboard(y);
    };
    tabs.appendChild(btn);
  });
  renderDashboard(activeYear);
}

// ── Tab switching ──
function switchTab(tab) {
  activeTab = tab;
  ['yazilim','test','analiz'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('page-'+t).style.display = t===tab ? 'block' : 'none';
  });
  document.getElementById('page-person').style.display = 'none';
  document.getElementById('year-tabs').style.display = tab==='yazilim' ? 'flex' : 'none';
  if (tab==='yazilim') renderDashboard(activeYear);
  else if (tab==='test') { destroyCharts(); renderTest(); }
  else if (tab==='analiz') { destroyCharts(); renderAnaliz(); }
}

// ── Helpers ──
function destroyCharts() {
  chartInstances.forEach(c => c.destroy());
  chartInstances = [];
}

function summaryCard(label, value, sub, color, href) {
  const tag = href ? 'a' : 'div';
  const extra = href ? `href="${href}" target="_blank" style="text-decoration:none;display:block;cursor:pointer"` : '';
  return `<${tag} ${extra} class="summary-card">
    <div class="summary-label">${label}</div>
    <div class="summary-value" style="color:${color}">${value}${href ? ' <span style="font-size:9px;opacity:.4">↗</span>' : ''}</div>
    <div class="summary-sub">${sub}</div>
  </${tag}>`;
}

function barColor(r) {
  return r>=1?'#34d399':r>=.8?'#60a5fa':r>=.6?'#fbbf24':'#f87171';
}
function pillColor(r) {
  if(r>=1)  return {bg:'rgba(52,211,153,.15)',color:'#34d399'};
  if(r>=.8) return {bg:'rgba(96,165,250,.15)',color:'#60a5fa'};
  if(r>=.6) return {bg:'rgba(251,191,36,.15)',color:'#fbbf24'};
  return {bg:'rgba(248,113,113,.15)',color:'#f87171'};
}
function shortSprint(s) {
  if(!s) return '';
  return s.split('-').slice(-1)[0].trim().slice(0,8);
}
function shortSprintPerson(s) {
  if(!s) return '';
  return s.replace(/\(.*\)/,'').trim().slice(0,12);
}

// ── Main Dashboard ──
function renderDashboard(year) {
  destroyCharts();
  const yearData = EMBEDDED_DATA[year];
  if(!yearData) return;
  const prevYear = String(Number(year)-1);
  const prevData = EMBEDDED_DATA[prevYear];

  const personStats = {};
  PEOPLE.forEach(p => {
    if(!yearData[p]) return;
    const d = yearData[p];
    const ratios = d.map(s => s.ratio);
    const avg = ratios.reduce((a,b)=>a+b,0)/ratios.length;
    personStats[p] = {
      avg, total: d.length,
      above: ratios.filter(r=>r>=1).length,
      totalActual: d.reduce((a,s)=>a+s.actual,0),
      totalExpected: d.reduce((a,s)=>a+s.expected,0),
      avgActual: d.reduce((a,s)=>a+s.actual,0)/d.length,
      avgItems: d.filter(s=>s.items).reduce((a,s)=>a+s.items,0)/(d.filter(s=>s.items).length||1),
      best: Math.max(...ratios), worst: Math.min(...ratios),
    };
  });

  const sortedPeople = PEOPLE.filter(p=>yearData[p]).sort((a,b)=>personStats[b].avg-personStats[a].avg);
  const teamActual = Object.values(personStats).reduce((a,s)=>a+s.totalActual,0);
  const teamExpected = Object.values(personStats).reduce((a,s)=>a+s.totalExpected,0);
  const teamRatio = teamExpected>0?teamActual/teamExpected:0;
  const teamSprints = Math.max(...Object.values(personStats).map(s=>s.total));

  let html = [];

  // Summary
  html.push('<div class="summary-strip">');
  html.push(summaryCard('Gerçekleşen/Beklenen',(teamRatio*100).toFixed(0)+'%',year,teamRatio>=1?'#34d399':teamRatio>=.8?'#60a5fa':'#fbbf24'));
  html.push(summaryCard('Toplam sprint',teamSprints,'bu yıl','#818cf8'));
  html.push(summaryCard('Toplam score',Math.round(teamActual).toLocaleString(),'gerçekleşen','#60a5fa'));
  html.push(summaryCard('Beklenen score',Math.round(teamExpected).toLocaleString(),'hedef','#6b7280'));
  html.push(summaryCard('Aktif üye',6,'kişi','#6ee7b7'));
  html.push('</div>');

  // Person cards
  html.push('<div class="section-header"><span class="section-title">Kişi bazlı özet</span></div>');
  html.push('<div class="person-grid">');
  sortedPeople.forEach(p => {
    const s = personStats[p];
    const av = AVATARS[p]||{bg:'#222',color:'#aaa',initials:'?'};
    const prev = prevData&&prevData[p]?prevData[p]:null;
    let prevAvg = null;
    if(prev) { const pr=prev.map(d=>d.ratio); prevAvg=pr.reduce((a,b)=>a+b,0)/pr.length; }
    const diff = prevAvg!==null?((s.avg-prevAvg)*100).toFixed(0):null;
    const trendLabel = diff===null?'':Math.abs(diff)<3?'Stabil':(diff>0?'▲ '+Math.abs(diff)+'%':'▼ '+Math.abs(diff)+'%');
    const trendBg = diff===null?'transparent':Math.abs(diff)<3?'rgba(107,114,128,.2)':(diff>0?'rgba(52,211,153,.15)':'rgba(248,113,113,.15)');
    const trendColor = diff===null?'transparent':Math.abs(diff)<3?'#6b7280':(diff>0?'#34d399':'#f87171');
    const w = Math.min(s.avg*100,100);
    const bc = barColor(s.avg);
    const prevW = prevAvg!==null?Math.min(prevAvg*100,100):null;
    const prevBc = prevAvg!==null?barColor(prevAvg):null;
    html.push(`<div class="person-card" onclick="openPerson('${p}')">
      <div class="pc-header">
        <div class="pc-avatar" style="background:${av.bg};color:${av.color}">${av.initials}</div>
        <div>
          <div class="pc-name">${p}${p==='Furkan'?' <span style="font-size:10px;color:#6b7280;font-weight:400">· 15 Mayıs 2026\'da ayrıldı</span>':''}</div>
          <div class="pc-sprints">${s.total} sprint · ${s.above}/${s.total} hedef</div>
        </div>
        ${trendLabel?`<span class="pc-badge" style="background:${trendBg};color:${trendColor}">${trendLabel}</span>`:''}
      </div>
      <div class="pc-bar-row">
        <span class="pc-year">${year}</span>
        <div class="pc-bar-bg"><div class="pc-bar-fill" style="width:${w}%;background:${bc}">${(s.avg*100).toFixed(0)}%</div></div>
        <span class="pc-bar-label" style="color:${bc}">${(s.avg*100).toFixed(0)}%</span>
      </div>
      ${prevAvg!==null?`<div class="pc-bar-row">
        <span class="pc-year">${prevYear}</span>
        <div class="pc-bar-bg"><div class="pc-bar-fill" style="width:${prevW}%;background:${prevBc}">${(prevAvg*100).toFixed(0)}%</div></div>
        <span class="pc-bar-label" style="color:${prevBc}">${(prevAvg*100).toFixed(0)}%</span>
      </div>`:''}
      <hr class="pc-divider">
      <div class="pc-stats">
        <div><div class="pc-stat-label">Ort. score</div><div class="pc-stat-value">${s.avgActual.toFixed(0)}</div><div class="pc-stat-sub">/ sprint</div></div>
        <div><div class="pc-stat-label">En iyi sprint</div><div class="pc-stat-value" style="color:#34d399">${(s.best*100).toFixed(0)}%</div><div class="pc-stat-sub">ger/bek</div></div>
        <div><div class="pc-stat-label">Ort. item</div><div class="pc-stat-value">${s.avgItems.toFixed(1)}</div><div class="pc-stat-sub">/ sprint</div></div>
      </div>
    </div>`);
  });
  html.push('</div>');

  // Charts
  html.push('<div class="charts-grid">');
  html.push('<div class="chart-card"><div class="chart-title">Kapasite karşılaştırması</div><div style="position:relative;height:260px"><canvas id="chart-bar"></canvas></div></div>');
  html.push('<div class="chart-card"><div class="chart-title">Sprint bazlı ekip trendi</div><div style="position:relative;height:260px"><canvas id="chart-trend"></canvas></div></div>');
  html.push('</div>');

  // Sprint table
  html.push('<div class="section-header"><span class="section-title">Sprint detay tablosu</span></div>');
  html.push('<div class="trend-card"><table class="trend-table"><thead><tr><th>Kişi</th>');
  const allSprints = [];
  PEOPLE.forEach(p => { if(!yearData[p]) return; yearData[p].forEach((d,i)=>{ if(!allSprints[i]) allSprints[i]=d.sprint; }); });
  const recent = allSprints.slice(-12);
  recent.forEach(s => html.push(`<th>${shortSprint(s)}</th>`));
  html.push('</tr></thead><tbody>');
  sortedPeople.forEach(p => {
    const av = AVATARS[p]||{color:'#aaa'};
    html.push(`<tr><td style="font-weight:500;color:${av.color}">${p}</td>`);
    const rd = yearData[p]?yearData[p].slice(-12):[];
    recent.forEach((_,i) => {
      const d=rd[i];
      if(!d){html.push('<td>—</td>');return;}
      const pc=pillColor(d.ratio);
      html.push(`<td><span class="cell-pill" style="background:${pc.bg};color:${pc.color}">${(d.ratio*100).toFixed(0)}%</span></td>`);
    });
    html.push('</tr>');
  });
  html.push(`<tr><td colspan="${recent.length+1}" style="padding:6px 10px 2px;font-size:10px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;border-top:1px solid rgba(255,255,255,.1)">KPI Notu</td></tr>`);
  sortedPeople.forEach(p => {
    const av = AVATARS[p]||{color:'#aaa'};
    html.push(`<tr><td style="font-weight:500;color:${av.color};font-size:12px">${p}</td>`);
    const rd = yearData[p]?yearData[p].slice(-12):[];
    recent.forEach((_,i) => {
      const d=rd[i];
      if(!d||d.kpi===null){html.push('<td style="color:var(--muted);text-align:center">—</td>');return;}
      const sprintKpis = sortedPeople.map(pp=>{ const dd=yearData[pp]&&yearData[pp].slice(-12)[i]; return dd&&dd.kpi!==null?dd.kpi:null; }).filter(v=>v!==null);
      const avg=sprintKpis.reduce((a,b)=>a+b,0)/sprintKpis.length;
      const max=Math.max(...sprintKpis), min=Math.min(...sprintKpis);
      let kc='#9ca3af',kb='transparent';
      if(d.kpi===max){kc='#34d399';kb='rgba(52,211,153,.15)';}
      else if(d.kpi===min){kc='#f87171';kb='rgba(248,113,113,.15)';}
      else if(d.kpi<avg){kc='#fb923c';kb='rgba(251,146,60,.15)';}
      html.push(`<td><span class="cell-pill" style="background:${kb};color:${kc}">${d.kpi.toFixed(2)}</span></td>`);
    });
    html.push('</tr>');
  });
  html.push('</tbody></table>');
  html.push('<div class="legend">');
  ['≥100% / KPI 1.:#34d399','80–99%:#60a5fa','60–79%:#fbbf24','<60% / KPI son:#f87171','KPI ort. altı:#fb923c'].forEach(item => {
    const [label,color]=item.split(':');
    html.push(`<div class="legend-item"><div class="legend-dot" style="background:${color}"></div>${label}</div>`);
  });
  html.push('</div></div>');

  // Şampiyonluk
  html.push('<div class="section-header" style="margin-top:28px">');
  html.push('<span class="section-title">🏆 Şampiyonluk Sıralaması</span>');
  html.push('<div style="display:flex;gap:4px">');
  html.push(`<button class="year-tab ${year==='2026'?'active':''}" onclick="renderChampions('2026')">2026</button>`);
  html.push(`<button class="year-tab ${year==='2025'?'active':''}" onclick="renderChampions('2025')">2025</button>`);
  html.push('</div></div>');
  html.push('<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">');
  html.push('<div class="chart-card"><div class="chart-title">Kudo Şampiyonu</div><div id="champ-kudo"></div></div>');
  html.push('<div class="chart-card"><div class="chart-title">KPI Şampiyonu</div><div id="champ-kpi"></div></div>');
  html.push('</div>');
  html.push('<div class="chart-card" style="margin-bottom:28px"><div class="chart-title">Kombine Sıralama (Kudo + KPI)</div><div id="champ-podium" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px"></div></div>');

  document.getElementById('page-yazilim').innerHTML = html.join('');

  requestAnimationFrame(() => {
    // Bar chart
    const bc = new Chart(document.getElementById('chart-bar'), {
      type:'bar',
      data:{labels:sortedPeople,datasets:[{data:sortedPeople.map(p=>(personStats[p].avg*100).toFixed(1)),backgroundColor:sortedPeople.map(p=>barColor(personStats[p].avg)),borderRadius:4,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:11}},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}},y:{min:0,max:130,ticks:{color:'#6b7280',font:{family:'DM Mono',size:11},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}}}}
    });
    chartInstances.push(bc);

    // Trend chart
    const sprintMap={};
    PEOPLE.forEach(p=>{ if(!yearData[p]) return; yearData[p].forEach((d,i)=>{ if(!sprintMap[i]) sprintMap[i]={sprint:d.sprint,ratios:[]}; sprintMap[i].ratios.push(d.ratio); }); });
    const spKeys=Object.keys(sprintMap).map(Number).sort((a,b)=>a-b);
    const tLabels=spKeys.map(k=>shortSprint(sprintMap[k].sprint));
    const tVals=spKeys.map(k=>{ const r=sprintMap[k].ratios; return (r.reduce((a,b)=>a+b,0)/r.length*100).toFixed(1); });
    const tc = new Chart(document.getElementById('chart-trend'), {
      type:'line',
      data:{labels:tLabels,datasets:[{data:tVals,borderColor:'#818cf8',backgroundColor:'rgba(129,140,248,.08)',borderWidth:2,pointRadius:3,pointBackgroundColor:'#818cf8',fill:true,tension:.3}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:10},maxRotation:45,autoSkip:true,maxTicksLimit:12},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}},y:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:11},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}}}}
    });
    chartInstances.push(tc);

    renderChampions(year);
  });
}

// ── Champions ──
function renderChampions(year) {
  activeChampYear = year;
  document.querySelectorAll('.section-header .year-tab').forEach(b => b.classList.toggle('active', b.textContent===year));
  const data = CHAMPION_DATA[year]||{};
  const kudoS = Object.entries(data).filter(([,v])=>v.kudo>0).sort((a,b)=>b[1].kudo-a[1].kudo);
  const kpiS  = Object.entries(data).filter(([,v])=>v.kpi>0).sort((a,b)=>b[1].kpi-a[1].kpi);
  const combS = Object.entries(data).filter(([,v])=>v.total>0).sort((a,b)=>b[1].total-a[1].total);

  function barList(sorted, key) {
    if(!sorted.length) return '<div style="color:var(--muted);font-size:12px">Veri yok</div>';
    const max = sorted[0][1][key];
    return sorted.map(([name,v],i) => {
      const color = PERSON_COLORS[name]||'#9ca3af';
      const pct = (v[key]/max*100).toFixed(0);
      return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-family:var(--mono);font-size:11px;color:var(--muted);min-width:16px">${i+1}</span>
        <span style="font-size:13px;min-width:80px">${name}</span>
        <div style="flex:1;height:14px;background:var(--surface2);border-radius:3px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${color};border-radius:3px"></div></div>
        <span style="font-family:var(--mono);font-size:12px;color:${color};min-width:24px;text-align:right">${v[key]}</span>
      </div>`;
    }).join('');
  }

  const medals=['🥇','🥈','🥉'];
  const podium = combS.slice(0,8).map(([name,v],i) => {
    const color = PERSON_COLORS[name]||'#9ca3af';
    return `<div style="background:var(--surface2);border-radius:10px;padding:12px 16px;min-width:100px;text-align:center">
      <div style="font-size:18px;margin-bottom:4px">${medals[i]||i+1+'.'}</div>
      <div style="font-size:13px;font-weight:500;color:${color}">${name}</div>
      <div style="font-family:var(--mono);font-size:18px;font-weight:500;margin:4px 0">${v.total}</div>
      <div style="font-size:10px;color:var(--muted)">${v.kudo} kudo · ${v.kpi} kpi</div>
    </div>`;
  }).join('');

  const kudoEl=document.getElementById('champ-kudo');
  const kpiEl=document.getElementById('champ-kpi');
  const podEl=document.getElementById('champ-podium');
  if(kudoEl) kudoEl.innerHTML=barList(kudoS,'kudo');
  if(kpiEl)  kpiEl.innerHTML=barList(kpiS,'kpi');
  if(podEl)  podEl.innerHTML=podium;
}

// ── Person detail ──
function openPerson(name) {
  destroyCharts();
  ['yazilim','test','analiz'].forEach(t => document.getElementById('page-'+t).style.display='none');
  document.getElementById('page-person').style.display='block';
  document.getElementById('person-name').textContent=name;
  document.getElementById('year-tabs').style.display='none';

  const pdata=PERSON_DATA[name]||{};
  const years=Object.keys(pdata).filter(y=>(pdata[y]||[]).length>0).sort();
  activePersonYear=years[years.length-1];

  const tabs=document.getElementById('person-year-tabs');
  tabs.innerHTML='';
  years.forEach(y => {
    const btn=document.createElement('button');
    btn.className='year-tab'+(y===activePersonYear?' active':'');
    btn.textContent=y;
    btn.onclick=()=>{ activePersonYear=y; tabs.querySelectorAll('.year-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderPersonDetail(name,y); };
    tabs.appendChild(btn);
  });
  renderPersonDetail(name,activePersonYear);
}

function closePerson() {
  destroyCharts();
  document.getElementById('page-person').style.display='none';
  document.getElementById('year-tabs').style.display='flex';
  ['yazilim','test','analiz'].forEach(t => {
    document.getElementById('page-'+t).style.display = t===activeTab?'block':'none';
  });
  if (activeTab==='yazilim') renderDashboard(activeYear);
  if (activeTab==='test') renderTest();
  if (activeTab==='analiz') renderAnaliz();
}

function renderPersonDetail(name, year) {
  destroyCharts();
  const data=(PERSON_DATA[name]||{})[year]||[];
  const av=AVATARS[name]||{bg:'#222',color:'#aaa',initials:'?'};
  const labels=data.map(d=>shortSprintPerson(d.sprint));
  const metrics=[
    {key:'items',label:'Kodladığı Madde Sayısı',color:'#818cf8'},
    {key:'score',label:'Toplam Score',color:'#6ee7b7'},
    {key:'expected',label:'Beklenen Score',color:'#60a5fa'},
    {key:'capacity',label:'Kapasite %',color:'#fbbf24',pct:true},
    {key:'returned',label:'Testten Dönen Madde',color:'#f87171'},
    {key:'timespent',label:'TimeSpent (saat)',color:'#34d399'},
  ];
  const latest=data[data.length-1]||{};
  const avgCap=data.length?data.reduce((a,d)=>a+d.capacity,0)/data.length:0;
  const avgScore=data.length?data.reduce((a,d)=>a+d.score,0)/data.length:0;
  const totalRet=data.reduce((a,d)=>a+d.returned,0);

  let h=`<div style="padding:8px 0 20px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <div style="width:44px;height:44px;border-radius:50%;background:${av.bg};color:${av.color};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:500">${av.initials}</div>
      <div><div style="font-size:18px;font-weight:500">${name}</div><div style="font-size:12px;color:var(--muted)">${year} · ${data.length} sprint</div></div>
    </div>
    <div class="summary-strip" style="margin-bottom:24px">
      ${summaryCard('Gerçekleşen/Beklenen',(avgCap*100).toFixed(0)+'%',year,avgCap>=1?'#34d399':avgCap>=.8?'#60a5fa':'#fbbf24')}
      ${summaryCard('Ort. score',avgScore.toFixed(0),'/ sprint','#818cf8')}
      ${summaryCard('Toplam testten dönen',totalRet,'madde','#f87171')}
      ${summaryCard('Son sprint kap.',(latest.capacity||0)>0?((latest.capacity||0)*100).toFixed(0)+'%':'-',latest.sprint||'',(latest.capacity||0)>=1?'#34d399':(latest.capacity||0)>=.8?'#60a5fa':'#fbbf24')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      ${metrics.map((_,i)=>`<div class="chart-card"><div class="chart-title">${metrics[i].label}</div><div style="position:relative;height:200px"><canvas id="pc-${i}"></canvas></div></div>`).join('')}
    </div>
  </div>`;

  document.getElementById('person-content').innerHTML=h;

  requestAnimationFrame(()=>{
    metrics.forEach((m,i)=>{
      const canvas=document.getElementById('pc-'+i);
      if(!canvas) return;
      const values=data.map(d=>m.pct?parseFloat((d[m.key]*100).toFixed(1)):d[m.key]);
      const c=new Chart(canvas,{
        type:'line',
        data:{labels,datasets:[{data:values,borderColor:m.color,backgroundColor:m.color+'18',borderWidth:2,pointRadius:3,pointBackgroundColor:m.color,fill:true,tension:.3}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:9},maxRotation:45,autoSkip:true,maxTicksLimit:10},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}},y:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:10},callback:v=>m.pct?v+'%':v},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}}}}
      });
      chartInstances.push(c);
    });
  });
}

// ── Analiz ──
function renderAnaliz() {
  const metrics=[
    {key:'analiz_madde',label:'Analiz Edilen Madde'},
    {key:'analiz_score',label:'Analiz Score Toplamı'},
    {key:'analiz_geri_donen',label:'Analize Geri Dönen'},
    {key:'analiz_geri_oran',label:'Analiz Geri Dönme %',pct:true},
    {key:'staging_madde',label:'Staging Test Edilen'},
    {key:'staging_geri',label:'Staging Geri Dönen'},
    {key:'staging_oran',label:'Staging Dönme %',pct:true},
    {key:'prod_test',label:'Prod Test Edilen'},
    {key:'prod_geri',label:'Prod Geri Dönen'},
    {key:'prod_oran',label:'Prod Dönme %',pct:true},
    {key:'toplam_test',label:'Toplam Test Edilen'},
  ];

  const colors={'ÖMER':{bg:'#1a3a5c',color:'#60a5fa',initials:'ÖM'},'BURAK':{bg:'#14362c',color:'#34d399',initials:'BU'}};

  let h='<div style="padding:8px 0 20px">';

  // Kişi kartları
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px">';
  ['ÖMER','BURAK'].forEach(name=>{
    const d=ANALIZ_DATA[name]||{};
    const av=colors[name];
    const links=ANALIZ_LINKS[name]||{};
    h+=`<div class="chart-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <div style="width:36px;height:36px;border-radius:50%;background:${av.bg};color:${av.color};display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px">${av.initials}</div>
        <div style="font-size:15px;font-weight:500">${name}</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
    metrics.forEach(m=>{
      const val=d[m.key]!=null?(m.pct?d[m.key]+'%':(typeof d[m.key]==='number'?d[m.key].toFixed(m.key==='analiz_score'?2:0):d[m.key])):'-';
      const color=m.pct?(d[m.key]>10?'#f87171':d[m.key]>5?'#fbbf24':'#34d399'):av.color;
      const link=links[m.key]||'';
      const tag=link?'a':'div';
      const attrs=link?`href="${link}" target="_blank" style="text-decoration:none;display:block;cursor:pointer"`:'';
      h+=`<${tag} ${attrs} class="metric2"><div class="metric-label2">${m.label}${link?' <span style="font-size:9px;opacity:.4">↗</span>':''}</div><div class="metric-value2" style="color:${color};font-size:18px">${val}</div></${tag}>`;
    });
    h+='</div></div>';
  });
  h+='</div>';

  // Karşılaştırma grafikleri
  h+='<div class="section-header"><span class="section-title">Karşılaştırma</span></div>';
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px">';
  h+='<div class="chart-card"><div class="chart-title">Hacimler</div><div style="position:relative;height:220px"><canvas id="analiz-chart-0"></canvas></div></div>';
  h+='<div class="chart-card"><div class="chart-title">Geri Dönme Oranları (%)</div><div style="position:relative;height:220px"><canvas id="analiz-chart-1"></canvas></div></div>';
  h+='</div>';

  document.getElementById('analiz-content').innerHTML=h;

  const omer=ANALIZ_DATA['ÖMER']||{};
  const burak=ANALIZ_DATA['BURAK']||{};
  const chartGroups=[
    {labels:['Analiz','Staging','Prod','Toplam Test'],keys:['analiz_madde','staging_madde','prod_test','toplam_test']},
    {labels:['Analiz %','Staging %','Prod %'],keys:['analiz_geri_oran','staging_oran','prod_oran']},
  ];
  requestAnimationFrame(()=>{
    chartGroups.forEach((g,i)=>{
      const canvas=document.getElementById('analiz-chart-'+i);
      if(!canvas) return;
      const c=new Chart(canvas,{
        type:'bar',
        data:{labels:g.labels,datasets:[{label:'ÖMER',data:g.keys.map(k=>omer[k]||0),backgroundColor:'#60a5fa',borderRadius:4},{label:'BURAK',data:g.keys.map(k=>burak[k]||0),backgroundColor:'#34d399',borderRadius:4}]},
        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,labels:{color:'#9ca3af',font:{family:'DM Mono',size:11}}}},scales:{x:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:10}},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}},y:{ticks:{color:'#6b7280',font:{family:'DM Mono',size:10}},grid:{color:'rgba(255,255,255,.04)'},border:{color:'rgba(255,255,255,.07)'}}}}
      });
      chartInstances.push(c);
    });
  });
}
</script>
